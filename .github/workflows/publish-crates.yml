# Caller owns on:. Pin at @v2.
# CARGO_REGISTRY_TOKEN must belong to an owner of both crates on crates.io.
# Packages publish in dependency order: bcur first, then bcur-cli.
name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@v2
    permissions:
      contents: read
    with:
      packages: "bcur bcur-cli"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
