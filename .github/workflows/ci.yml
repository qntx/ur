name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build
    # bun run test → vp run -r test
    # scripts → bun run test:parity (TS generates, Rust replays)
    with:
      rust: true
      scripts: test:parity

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins the toolchain.
      deny: true
      # rustdoc runs with all features, matching docs.rs
      # ([package.metadata.docs.rs] all-features = true).
      doc: true

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      features: --no-default-features
      package-check: true

  portable:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown thumbv7m-none-eabi aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: bcur
      features: --no-default-features
      forbid-deps: getrandom

  portable-registry:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: bcur-registry
      features: --all-features
