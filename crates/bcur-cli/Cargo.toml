[package]
name                   = "bcur-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
description            = "Command-line Uniform Resource encoder with terminal QR output"
keywords               = ["ur", "bytewords", "qr", "cli"]
categories             = ["command-line-utilities", "encoding"]
readme                 = "README.md"
documentation          = "https://docs.rs/bcur-cli"
publish                = true

[[bin]]
name = "bcur"
path = "src/main.rs"
# The binary shares the `bcur` name with the library; documenting both
# collides in target/doc (rust-lang/cargo#6313).
doc = false

[dependencies]
bcur      = { workspace = true }
clap      = { version = "4", features = ["derive"] }
crossterm = "0.29"
hex       = { workspace = true }
qrcode    = { version = "0.14", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"

[lints]
workspace = true
