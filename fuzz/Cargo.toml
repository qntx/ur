[package]
name    = "bcur-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.bcur]
path = "../crates/bcur"

[dependencies.bcur-registry]
path     = "../crates/bcur-registry"
features = ["interop"]

[dependencies.dcbor]
version = "0.25"

# Isolated from the parent workspace so thumbv7m / just quality never see libFuzzer.
[workspace]
members = ["."]

[[bin]]
name  = "decode_ur"
path  = "fuzz_targets/decode_ur.rs"
test  = false
doc   = false
bench = false

